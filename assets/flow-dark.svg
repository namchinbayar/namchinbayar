<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Request flow: client, edge route and rate limit, PII guard, semantic cache; on hit stream back, on miss vector retrieval then model then stream back">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7ee7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="199" rx="14" fill="#0f141b" stroke="#30363d"/>
<g fill="none" stroke="#3d444d" stroke-width="1.5" marker-end="url(#ar)">
<path d="M110,62 H138"/><path d="M260,62 H288"/><path d="M390,62 H418"/>
<path d="M520,62 H760" stroke-dasharray="0" />
<path d="M470,94 V150 H538"/><path d="M660,150 H688"/><path d="M770,150 H810 V81"/>
</g>
<text x="640" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" fill="#3fb950">hit</text>
<text x="482" y="128" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">miss</text>

<rect x="20" y="45" width="90" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="65.0" y="66.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">client</text>
<rect x="140" y="40" width="120" height="44" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="200.0" y="58.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">edge route</text><text x="200.0" y="73.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">+ rate limit</text>
<rect x="290" y="45" width="100" height="34" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="340.0" y="66.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">PII guard</text>
<path d="M470,30 L520,62 L470,94 L420,62 Z" fill="#161b22" stroke="#30363d"/>
<text x="470" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">semantic</text><text x="470" y="73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">cache</text>
<rect x="540" y="133" width="120" height="34" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="600.0" y="154.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">vector retrieval</text>
<rect x="690" y="133" width="80" height="34" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="730.0" y="154.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">model</text>
<rect x="760" y="45" width="100" height="34" rx="17" fill="#161b22" stroke="url(#g)" stroke-width="1.5"/><text x="810.0" y="66.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">stream back</text>
<circle r="4" fill="#7ee7ff"><animateMotion path="M110,62 H420 L470,62 H760" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#a78bfa"><animateMotion path="M110,62 H420 L470,62 L470,150 H810 V79" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
</svg>